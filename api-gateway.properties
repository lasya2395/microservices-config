spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webmvc.routes[1].id=property-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://PROPERTY-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/properties/**

jwt.secret=MySecretKeyForJwtAuthentication12345678901234567890
jwt.expiration=86400000