spring.application.name=booking-service
server.port=8082

spring.datasource.url=jdbc:mysql://mysql:3306/booking_db
spring.datasource.username=root
spring.datasource.password=Lasya@2805


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.instance.prefer-ip-address=true

resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.sliding-window-size=10
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=5

jwt.secret=MySecretKeyForJwtAuthentication12345678901234567890
jwt.expiration=86400000